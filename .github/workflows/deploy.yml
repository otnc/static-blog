name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # OG 画像の永続キャッシュ。内容（記事タイトル・サムネイル）が変わらなければ
      # satori+sharp の再生成をスキップする。restore-keys で前回分を引き継ぎ、
      # 変更/新規の記事だけ再生成される。
      - name: Cache OG images
        uses: actions/cache@v4
        with:
          path: .cache/og
          # キャッシュファイル名は内容ハッシュ（タイトル+サムネ+CACHE_VERSION）で
          # 命名されるため、このキーはキャッシュ再利用効率のためのもの。記事/サムネが
          # 変わると新キーになり、restore-keys で前回分を引き継いで差分だけ再生成する。
          key: ${{ runner.os }}-og-${{ hashFiles('src/content/blog/**', 'public/files/**/_thumbnail.*', 'public/thumbnail.png') }}
          restore-keys: |
            ${{ runner.os }}-og-

      - name: Build
        run: pnpm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
